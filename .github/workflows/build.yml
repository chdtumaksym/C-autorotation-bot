name: Build Pixel Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile Bot
      run: |
        cl.exe /utf-8 /EHsc /O2 /W3 /MT /D UNICODE /D _UNICODE bot.cpp user32.lib gdi32.lib shell32.lib comctl32.lib /Fe:PixelBot.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PixelBot-Executable
        path: PixelBot.exe
